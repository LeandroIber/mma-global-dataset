name: MMA ETL Pipeline

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        organization:
          - 'UFC Stats'
          - 'Bellator Stats'
          - 'PFL Stats'
          - 'Rizin Stats'
          - 'Aca Stats'
          - 'Ksw Stats'
          - 'Oktagon Stats'
          - 'Cage Warrios Stats'
          - 'LFA Stats'
          - 'Jungle Fight Stats'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          cd "${{ matrix.organization }}"
          python run_pipeline.py
